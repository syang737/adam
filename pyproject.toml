[project]
name = "food-deals"
version = "0.1.0"
description = "Find the cheapest nearby location for a fast-food item, counting the trip."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
food-deals = "food_deals.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["food_deals*"]
